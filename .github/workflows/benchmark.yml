name: Benchmark

# Benchmark numbers from shared runners are noisy, so this workflow does not
# gate pull requests. It is manual-only: use "Run workflow" whenever a
# measurement is needed. Each run uploads summary.md as an artifact and
# appends it to the job summary.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Topology: direct (baseline) / relay (multi-hop) / both'
        required: true
        default: 'both'
        type: choice
        options:
          - direct
          - relay
          - both
      profiles:
        description: 'Comma separated netem profiles, or "all"'
        required: true
        default: 'clean,latency,loss,congested,mobile'
        type: string
      duration:
        description: 'Seconds per iperf3 run'
        required: true
        default: '5'
        type: string
      parallel:
        description: 'TCP streams per iperf3 run'
        required: true
        default: '4'
        type: string
      relay_limit_kib:
        description: 'Relay cap in KiB/s (0 = accounting only, no FQ/CoDel)'
        required: true
        default: '2048'
        type: string
      ipv6:
        description: 'Keep dual-stack and add IPv6 ping probes'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: irohlan-benchmark
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Fallbacks also cover inputs left blank on a manual run.
  BENCH_MODE: ${{ inputs.mode || 'both' }}
  BENCH_PROFILES: ${{ inputs.profiles || 'clean,latency,loss,congested,mobile' }}
  BENCH_DURATION: ${{ inputs.duration || '5' }}
  BENCH_PARALLEL: ${{ inputs.parallel || '4' }}
  BENCH_RELAY_LIMIT: ${{ inputs.relay_limit_kib || '2048' }}
  BENCH_IPV6_FLAG: ${{ inputs.ipv6 == true && '--ipv6' || '' }}

jobs:
  benchmark:
    name: Baseline + weak-network (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            iproute2 iperf3 iputils-ping python3 coreutils
          # GitHub runners normally expose /dev/net/tun; create it if the
          # kernel module is built in but the device node is absent.
          sudo modprobe tun || true
          if [[ ! -e /dev/net/tun ]]; then
            sudo mkdir -p /dev/net
            sudo mknod /dev/net/tun c 10 200
            sudo chmod 666 /dev/net/tun
          fi
          ip -V
          tc -V
          iperf3 --version
          ls -l /dev/net/tun
          python3 --version

      - name: Build release binary
        run: cargo build --release

      - name: Smoke test CLI
        run: ./target/release/irohlan --help

      - name: Run benchmark
        run: |
          set -euo pipefail
          extra=()
          if [[ -n "$BENCH_IPV6_FLAG" ]]; then
            extra+=("$BENCH_IPV6_FLAG")
          fi
          # Invoke via bash: git does not reliably preserve the executable bit
          # across platforms, so do not depend on the script's file mode.
          sudo bash ./bench/run.sh \
            --binary "$PWD/target/release/irohlan" \
            --mode "$BENCH_MODE" \
            --profiles "$BENCH_PROFILES" \
            --duration "$BENCH_DURATION" \
            --parallel "$BENCH_PARALLEL" \
            --relay-limit-kib "$BENCH_RELAY_LIMIT" \
            --out "$PWD/bench-results" \
            "${extra[@]}"

      - name: Make results readable
        if: always()
        run: |
          if [[ -d bench-results ]]; then
            sudo chown -R "$(id -u):$(id -g)" bench-results || true
          fi

      - name: Assert measurements completed
        run: python3 bench/report.py --root bench-results --fail-on-error >/dev/null

      - name: Publish job summary
        if: always()
        run: |
          if [[ -f bench-results/summary.md ]]; then
            {
              echo "## irohlan benchmark"
              echo ""
              echo "- profiles: \`${BENCH_PROFILES}\` (duration ${BENCH_DURATION}s, relay cap ${BENCH_RELAY_LIMIT} KiB/s)"
              echo "- results: see the \`irohlan-benchmark-results\` artifact"
              echo ""
              cat bench-results/summary.md
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## irohlan benchmark" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Benchmark did not produce a summary; check the run log." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: irohlan-benchmark-results
          path: |
            bench-results/summary.json
            bench-results/summary.md
            bench-results/**/meta.json
            bench-results/**/tcp.json
            bench-results/**/udp.json
            bench-results/**/ping*.txt
            bench-results/**/status-*.json
            bench-results/**/before-*.json
            bench-results/**/metrics-*.prom
            bench-results/**/http-metrics-*.prom
            bench-results/**/ledger-*.json
            bench-results/**/log-*.txt
            bench-results/**/errors.txt
          if-no-files-found: warn
          retention-days: 30
